name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy from the Actions tab without pushing anything.
  workflow_dispatch:

# Pages needs these to publish; the token is scoped to this run only.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. In-progress runs finish rather than being
# cancelled, so a half-uploaded site is never what ends up live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        # `npm install`, deliberately, not `npm ci` — please don't "fix" this.
        #
        # sharp ships a wasm32 build whose @emnapi/* dependencies npm resolves
        # differently on Linux than on the Windows machine the lockfile is
        # maintained on: the runner wants @emnapi/wasi-threads@1.2.3 where the
        # lockfile pins 1.2.1, and wants @emnapi/core, which npm on Windows
        # never writes into the lock at all. `npm ci` treats any of that as a
        # fatal desync and refuses to install, so the deploy dies before it
        # builds anything. Regenerating the lockfile does not help, because
        # the difference comes from the platform, not from staleness.
        #
        # `npm install` reconciles instead of failing. Versions are still
        # driven by the committed lockfile; only these optional native
        # variants are allowed to differ, and they are build-time only.
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - uses: actions/configure-pages@v5
        id: pages

      - name: Build static export
        env:
          # Switches next.config.ts into export mode: output: 'export',
          # trailingSlash, and unoptimized images. NOT a path prefix — the site
          # is served from the root of the custom domain.
          GITHUB_PAGES: "true"
          # Feeds canonical tags, the sitemap and the WhatsApp/OpenGraph share
          # previews. Written out in full rather than taken from
          # configure-pages' base_url: that output follows whatever Pages
          # currently reports, which is http:// until GitHub finishes issuing
          # the certificate — and an http canonical on every page is not
          # something anyone would notice quickly.
          NEXT_PUBLIC_SITE_URL: https://www.craftohfa.com
        run: npm run build

      - name: Shrink images
        # Pages cannot run Next's image optimiser, so this does the resizing
        # that would otherwise happen per-request. Roughly halves the payload.
        run: node scripts/shrink-export.mjs

      - name: Fix RSC prefetch filenames
        # Next 16 writes route prefetch payloads to nested directories but
        # requests them under a flat, dot-joined name. Harmless on a server,
        # a wall of 404s on a file host. See the script for detail.
        run: node scripts/flatten-rsc.mjs

      - name: Disable Jekyll
        # Without this, Pages runs the export through Jekyll, which silently
        # drops every directory beginning with an underscore — including
        # _next/, i.e. all the JavaScript and CSS. The site would render as
        # unstyled HTML with no explanation.
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
